rules:
  - id: security-lab.jwt-ignore-expiration-unexpected
    message: >
      jwt.verify() is called with ignoreExpiration: true outside the documented
      WEB-002 lab function. This disables session expiry. Either move the code
      to the lab path with a report, or remove the flag (use clockTolerance).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-613"
      lab-intentional: false
    paths:
      exclude:
        - "**/web-api-security/vulnerable-api/src/services/authService.ts"
    pattern: "ignoreExpiration: true"

  - id: security-lab.insecure-tls-disable
    message: Disabling TLS certificate validation is not allowed in this repository.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-295"
      lab-intentional: false
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: '{"NODE_TLS_REJECT_UNAUTHORIZED": "0"}'

  - id: security-lab.dynamic-code-execution
    message: eval / Function on untrusted input is a high-confidence issue. Not a documented lab finding.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-95"
      lab-intentional: false
    pattern-either:
      - pattern: eval($X)
      - pattern: new Function($X)
